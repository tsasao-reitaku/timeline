</style><style>#wrap{position:relative;width:100%;overflow:visible}#quantViewport{position:relative;height:33vh;min-height:210px;overflow:hidden}#quantViewport svg{width:100%;height:100%;min-width:0;border-bottom:0}#timelineViewport{height:calc(67vh - 12px);min-height:220px;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line)}#timelineViewport svg{width:100%;min-width:0;background:white;border-top:0}</style><script>document.addEventListener('DOMContentLoaded',()=>{const original=document.getElementById('chart'),wrap=document.getElementById('wrap');if(!original||!wrap)return;const quant=document.createElement('div');quant.id='quantViewport';const quantChart=document.createElementNS('http://www.w3.org/2000/svg','svg');quantChart.id='quantChart';quantChart.setAttribute('aria-hidden','true');quant.append(quantChart);const axis=wrap.querySelector('.axis-mid');if(axis)quant.append(axis);const timeline=document.createElement('div');timeline.id='timelineViewport';wrap.insertBefore(quant,original);timeline.append(original);wrap.append(timeline);const sync=()=>{const vb=original.getAttribute('viewBox');if(!vb)return;const [,top,width,height]=vb.split(' ').map(Number),timelineTop=top||282,timelineHeight=Math.max(1,height-timelineTop);quantChart.innerHTML=original.innerHTML;quantChart.setAttribute('viewBox',`0 0 ${width} ${top||330}`);quantChart.setAttribute('preserveAspectRatio','xMidYMin meet');quantChart.style.width='100%';quantChart.style.height='100%';original.setAttribute('viewBox',`0 ${timelineTop} ${width} ${timelineHeight}`);original.setAttribute('preserveAspectRatio','xMidYMin meet');timeline.style.height=`calc(67vh - 12px)`;original.style.height=`${Math.max(360,timelineHeight*original.clientWidth/width)}px`;const qhit=[...original.querySelectorAll('rect')].find(node=>node.getAttribute('x')==='235'&&node.getAttribute('y')==='42');if(qhit&&!quantChart.dataset.hoverForwarder){quantChart.dataset.hoverForwarder='1';quantChart.addEventListener('mousemove',eve
