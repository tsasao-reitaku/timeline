<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>定量グラフ・出来事年表（インタラクティブ）</title>

    <style>
        :root {
            --line: #d8dee4;
            --ink: #17202a;
            --sub: #53606b;
            --accent: #176d75;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 16px;
            max-width: 1220px;
            margin-inline: auto;
            font-family:
                -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic",
                sans-serif;
            color: var(--ink);
            background: #f5f7f8;
        }

        body>#wrap {
            order: 1;
        }

        body>.details {
            order: 2;
        }

        body>h1,
        body>p.intro,
        body>.toolbar,
        body>.metric-row,
        body>.tp-heading,
        body>#tpTags,
        body>#tpMode,
        body>.hint,
        body>.tp-dialog,
        body>#csvDialog {
            order: 3;
        }

        h1 {
            font-size: 20px;
            margin: 24px 0 4px;
        }

        p.intro {
            color: var(--sub);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 16px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .toolbar button {
            background: var(--accent);
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 7px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .toolbar .export {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--sub);
        }

        .toolbar .export button {
            background: white;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .metric-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin: 8px 0;
        }

        .tp-heading {
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
        }

        .tp-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }

        .tp-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fdf3e4;
            border: 1px solid #d9b877;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 12px;
        }

        .tp-tag button {
            border: 0;
            background: none;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            color: #8a5a1e;
        }

        #tpMode {
            border: 1px solid var(--accent);
            background: white;
            color: var(--accent);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .hint {
            font-size: 12px;
            color: var(--sub);
            margin: 8px 0;
        }

        dialog {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 18px;
            max-width: 480px;
        }

        dialog .dialog-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 10px 0;
        }

        dialog .csv-info {
            font-size: 11.5px;
            color: var(--sub);
            background: #eef2f5;
            padding: 8px 10px;
            border-radius: 6px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .tp-dialog {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        #wrap {
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        #quantViewport {
            height: 300px;
            border-bottom: 1px solid var(--line);
        }

        #quantViewport svg,
        #timelineViewport svg {
            width: 100%;
            display: block;
        }

        #timelineViewport {
            height: 60vh;
            min-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .grid {
            stroke: #e7ebee;
            stroke-width: 1;
        }

        .axis {
            stroke: #b7c0c8;
            stroke-width: 1;
        }

        .tick {
            fill: var(--sub);
            font-size: 11px;
        }

        .qarea {
            fill: #9fd3d8;
            fill-opacity: 0.5;
        }

        .qline {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.5;
        }

        .quant-dot {
            stroke: white;
            stroke-width: 1.5;
        }

        .turn {
            stroke: #9b5a1e;
            stroke-width: 1.3;
            stroke-dasharray: 4 3;
        }

        .turntext {
            fill: #7a1f1f;
            font-size: 12px;
        }

        .guideline {
            stroke: #8a97a3;
            stroke-width: 1;
            stroke-dasharray: 3 3;
            pointer-events: none;
        }

        .guidetext {
            fill: #33414d;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
        }

        .lane-label {
            font-size: 12px;
            font-weight: 600;
        }

        .lane-label.selected {
            text-decoration: underline;
        }

        .lane-band {
            fill: #f5f7f8;
        }

        .eventtext {
            font-size: 11.5px;
            fill: #17202a;
        }

        .chart-title {
            font-size: 20px;
            font-weight: 700;
            fill: var(--ink);
            cursor: text;
        }

        .title-edit {
            position: absolute;
            font-size: 16px;
            font-weight: 700;
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 2px 6px;
        }

        @media print {

            #quantViewport,
            #timelineViewport {
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
            }

            .toolbar,
            .metric-row,
            .tp-heading,
            #tpTags,
            #tpMode,
            .hint,
            .tp-dialog {
                display: none !important;
            }
        }

        .details {
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 12px;
        }

        .details h2 {
            font-size: 14px;
            margin: 0 0 10px;
        }

        .details .hint {
            margin: 0;
        }

        .event-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .event-card .quote {
            font-style: italic;
            color: var(--sub);
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            border-left: 2px solid #b7c0c8;
            margin-top: 2px;
        }

        .event-card .source {
            font-size: 11px;
            color: var(--sub);
        }

        .event-card .source a {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <!-- タイトルと概要 -->
    <h1 contenteditable="true" id="chartTitle">ポケベルの普及・衰退と社会的出来事</h1>
    <p class="intro">定量データ（加入者数など）と定性データ（歴史的出来事）を重ね合わせて、歴史の転換点を分析する可視化ツールです。</p>

    <!-- 操作ツールバー -->
    <div class="toolbar">
        <button id="downloadCsvBtn" onclick="alert('CSVひな型ダウンロード機能')">📥 CSVひな型をダウンロード</button>
        <button id="loadCsvBtn" onclick="initVisualization()">🔄 CSVデータを再読み込み</button>
        <div class="export">
            <span>エクスポート:</span>
            <button id="exportSvgBtn">SVG</button>
            <button id="exportPngBtn">PNG</button>
        </div>
    </div>

    <!-- エラーメッセージ表示エリア（堅牢性の向上） -->
    <div id="errorMessage"
        style="display: none; color: #7a1f1f; background: #fdf3e4; border: 1px solid #d9b877; padding: 10px 14px; border-radius: 6px; margin: 10px 0; font-size: 13px;">
    </div>

    <!-- メイン可視化コンテナ -->
    <div id="wrap">
        <div id="quantViewport"></div>
        <div id="timelineViewport"></div>
    </div>

    <!-- 出来事の詳細表示エリア -->
    <div class="details" id="event-details">
        <h2>出来事の詳細</h2>
        <div id="detailsContent">
            <p class="hint">年表の出来事をクリックすると、詳細が表示されます。</p>
        </div>
    </div>

    <!-- 転換点（ターニングポイント）操作エリア -->
    <div class="tp-heading">転換点（ターニングポイント）メモ</div>
    <div id="tpTags" class="tp-tags"></div>
    <button id="tpMode">＋ 転換点を追加</button>

    <!-- D3.js v7 本体ライブラリ（CDN） -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <!-- アプリケーション・メインスクリプト -->
    <script>
        /**
 * エラー表示のクリア
 */
        function clearError() {
            const errorElem = document.getElementById('errorMessage');
            if (errorElem) {
                errorElem.style.display = 'none';
                errorElem.innerText = '';
            }
        }

        /**
         * 学生向けのエラーメッセージ表示
         */
        function displayError(message) {
            let errorElem = document.getElementById('errorMessage');
            if (!errorElem) {
                errorElem = document.createElement('div');
                errorElem.id = 'errorMessage';
                errorElem.style.cssText = 'color: #7a1f1f; background: #fdf3e4; border: 1px solid #d9b877; padding: 12px 16px; border-radius: 6px; margin: 12px 0; font-size: 13px; line-height: 1.6;';
                const wrap = document.getElementById('wrap');
                if (wrap && wrap.parentNode) {
                    wrap.parentNode.insertBefore(errorElem, wrap);
                } else {
                    document.body.prepend(errorElem);
                }
            }
            errorElem.style.display = 'block';
            errorElem.innerHTML = `<strong>⚠️ データ読み込み・描画エラー</strong><br/>${message}`;
        }

        /**
         * 先頭の '#' コメント行をスキップし、ダブルクォート囲みに対応したCSVパース関数
         */
        function parseCSV(csvText) {
            if (!csvText || typeof csvText !== 'string') return [];

            const lines = csvText.split(/\r?\n/);
            const result = [];
            let headers = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith('#')) continue; // 先頭の '#' や空行をスキップ

                const row = [];
                let insideQuote = false;
                let entry = '';

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    const nextChar = line[j + 1];

                    if (char === '"') {
                        if (insideQuote && nextChar === '"') {
                            entry += '"';
                            j++;
                        } else {
                            insideQuote = !insideQuote;
                        }
                    } else if (char === ',' && !insideQuote) {
                        row.push(entry.trim());
                        entry = '';
                    } else {
                        entry += char;
                    }
                }
                row.push(entry.trim());

                if (!headers) {
                    headers = row;
                } else {
                    const rowObj = {};
                    headers.forEach((header, index) => {
                        rowObj[header] = row[index] !== undefined ? row[index] : '';
                    });
                    result.push(rowObj);
                }
            }
            return result;
        }

        /**
         * メインのデータ読み込み・初期化処理
         */
        async function initVisualization() {
            clearError();

            if (typeof d3 === 'undefined') {
                displayError('D3.js ライブラリが読み込まれていません。インターネット接続を確認してください。');
                return;
            }

            try {
                if (window.location.protocol === 'file:') {
                    throw new Error(
                        'ファイルを直接開いているため（file://）、ブラウザのセキュリティ制限（CORS）によりCSVの読み込みがブロックされています。<br/>' +
                        'VS Codeの拡張機能「Live Server」等を使用してローカルサーバー経由（http://...）で開いてください。'
                    );
                }

                const [eventsRes, quantRes] = await Promise.all([
                    fetch('出来事CSVひな型.csv').catch(e => { throw new Error('「出来事CSVひな型.csv」の読み込みに失敗しました: ' + e.message); }),
                    fetch('定量CSVひな型.csv').catch(e => { throw new Error('「定量CSVひな型.csv」の読み込みに失敗しました: ' + e.message); })
                ]);

                if (!eventsRes.ok) throw new Error(`「出来事CSVひな型.csv」が見つかりません (HTTP: ${eventsRes.status})`);
                if (!quantRes.ok) throw new Error(`「定量CSVひな型.csv」が見つかりません (HTTP: ${quantRes.status})`);

                const eventsText = await eventsRes.text();
                const quantText = await quantRes.text();

                const rawEvents = parseCSV(eventsText);
                const rawQuant = parseCSV(quantText);

                if (rawEvents.length === 0 && rawQuant.length === 0) {
                    throw new Error('読み込んだCSVデータが空か、全ての行がコメント（#）アウトされています。');
                }

                // 出来事データ整形
                const eventsData = rawEvents.map(row => {
                    const yearKey = Object.keys(row).find(k => k.includes('年') || k.toLowerCase().includes('year'));
                    const catKey = Object.keys(row).find(k => k.includes('カテゴリ') || k.includes('分類') || k.includes('レーン') || k.toLowerCase().includes('category'));
                    const titleKey = Object.keys(row).find(k => k.includes('出来事') || k.includes('タイトル') || k.toLowerCase().includes('title'));
                    const descKey = Object.keys(row).find(k => k.includes('詳細') || k.includes('説明') || k.toLowerCase().includes('desc'));
                    const quoteKey = Object.keys(row).find(k => k.includes('引用') || k.toLowerCase().includes('quote'));
                    const sourceKey = Object.keys(row).find(k => k.includes('出典') || k.toLowerCase().includes('source'));

                    const rawYear = row[yearKey] || Object.values(row)[0];
                    const year = parseInt(String(rawYear).replace(/[^0-9-]/g, ''), 10);

                    return {
                        year: isNaN(year) ? null : year,
                        category: (catKey && row[catKey]) ? row[catKey].trim() : '一般出来事',
                        title: (titleKey && row[titleKey]) ? row[titleKey] : (Object.values(row)[1] || '出来事'),
                        description: descKey ? row[descKey] : '',
                        quote: quoteKey ? row[quoteKey] : '',
                        source: sourceKey ? row[sourceKey] : ''
                    };
                }).filter(d => d.year !== null);

                // 定量データ整形
                const quantData = rawQuant.map(row => {
                    const yearKey = Object.keys(row).find(k => k.includes('年') || k.toLowerCase().includes('year'));
                    const valKey = Object.keys(row).find(k => k.includes('数値') || k.includes('件数') || k.includes('値') || k.toLowerCase().includes('value'));

                    const rawYear = row[yearKey] || Object.values(row)[0];
                    const rawVal = row[valKey] || Object.values(row)[1];

                    const year = parseInt(String(rawYear).replace(/[^0-9-]/g, ''), 10);
                    const cleanValStr = String(rawVal).replace(/,/g, '').replace(/[^0-9.-]/g, '');
                    const value = parseFloat(cleanValStr);

                    return {
                        year: isNaN(year) ? null : year,
                        value: isNaN(value) ? null : value
                    };
                }).filter(d => d.year !== null && d.value !== null);

                quantData.sort((a, b) => a.year - b.year);
                eventsData.sort((a, b) => a.year - b.year);

                const allYears = [...eventsData.map(d => d.year), ...quantData.map(d => d.year)];
                if (allYears.length === 0) throw new Error('解析可能な「年」データが存在しません。');

                const minYear = d3.min(allYears);
                const maxYear = d3.max(allYears);

                setupAndRenderCharts(eventsData, quantData, minYear, maxYear);

            } catch (err) {
                console.error(err);
                displayError(err.message);
            }
        }

        /**
         * 描画コンテナの準備とレンダリング実行
         */
        function setupAndRenderCharts(eventsData, quantData, minYear, maxYear) {
            const quantElem = d3.select('#quantViewport');
            const eventsElem = d3.select('#timelineViewport');

            quantElem.selectAll('svg').remove();
            eventsElem.selectAll('svg').remove();

            const width = 1100;
            const margin = { top: 45, right: 40, bottom: 25, left: 160 };

            const xScale = d3.scaleLinear()
                .domain([minYear - 1, maxYear + 1])
                .range([margin.left, width - margin.right]);

            renderQuantChart(quantElem, quantData, xScale, width, margin);
            renderEventsChart(eventsElem, eventsData, xScale, width, margin);
        }

        /**
         * 上部：定量グラフの描画
         */
        function renderQuantChart(container, quantData, xScale, width, margin) {
            const height = 280;
            const svg = container.append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .style('width', '100%')
                .style('height', 'auto');

            if (quantData.length === 0) return;

            const maxVal = d3.max(quantData, d => d.value);
            const yScale = d3.scaleLinear()
                .domain([0, maxVal * 1.15])
                .nice()
                .range([height - margin.bottom, margin.top + 20]);

            // グリッド
            svg.append('g')
                .attr('class', 'grid')
                .attr('transform', `translate(${margin.left}, 0)`)
                .call(d3.axisLeft(yScale).tickSize(-(width - margin.left - margin.right)).tickFormat(''));

            // Y軸
            const yAxis = d3.axisLeft(yScale).ticks(4).tickFormat(d3.format(','));
            svg.append('g')
                .attr('transform', `translate(${margin.left}, 0)`)
                .call(yAxis)
                .attr('class', 'tick');

            // 面（Area）
            const area = d3.area()
                .x(d => xScale(d.year))
                .y0(height - margin.bottom)
                .y1(d => yScale(d.value))
                .curve(d3.curveMonotoneX);

            svg.append('path')
                .datum(quantData)
                .attr('class', 'qarea')
                .attr('d', area);

            // 折れ線（Line）
            const line = d3.line()
                .x(d => xScale(d.year))
                .y(d => yScale(d.value))
                .curve(d3.curveMonotoneX);

            svg.append('path')
                .datum(quantData)
                .attr('class', 'qline')
                .attr('d', line);

            // ピーク注釈
            const peakData = quantData.reduce((max, item) => item.value > max.value ? item : max, quantData[0]);
            if (peakData) {
                const px = xScale(peakData.year);
                const py = yScale(peakData.value);

                svg.append('line')
                    .attr('class', 'turn')
                    .attr('x1', px).attr('y1', py)
                    .attr('x2', px).attr('y2', height - margin.bottom);

                svg.append('text')
                    .attr('class', 'turntext')
                    .attr('x', px + 6)
                    .attr('y', py + 12)
                    .text(`加入数ピーク ${peakData.value.toLocaleString()}件`);
            }

            // データ点
            svg.selectAll('.quant-dot')
                .data(quantData)
                .enter()
                .append('circle')
                .attr('class', 'quant-dot')
                .attr('cx', d => xScale(d.year))
                .attr('cy', d => yScale(d.value))
                .attr('r', 4)
                .attr('fill', 'var(--accent)');
        }

        /**
         * 下部：マルチレーン出来事年表の描画
         */
        function renderEventsChart(container, eventsData, xScale, width, margin) {
            if (eventsData.length === 0) return;

            const categories = Array.from(new Set(eventsData.map(d => d.category)));
            const laneHeight = 44;
            const height = Math.max(320, margin.top + categories.length * laneHeight + margin.bottom + 20);

            const svg = container.append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .style('width', '100%')
                .style('height', 'auto');

            const yScale = d3.scaleBand()
                .domain(categories)
                .range([margin.top, height - margin.bottom])
                .padding(0.12);

            // X軸
            const xAxis = d3.axisBottom(xScale).tickFormat(d3.format('d'));
            svg.append('g')
                .attr('transform', `translate(0, ${height - margin.bottom})`)
                .call(xAxis)
                .attr('class', 'tick');

            // レーン背景とラベル
            categories.forEach((cat, i) => {
                const y = yScale(cat);

                if (i % 2 === 0) {
                    svg.append('rect')
                        .attr('class', 'lane-band')
                        .attr('x', margin.left)
                        .attr('y', y)
                        .attr('width', width - margin.left - margin.right)
                        .attr('height', yScale.bandwidth());
                }

                svg.append('text')
                    .attr('class', 'lane-label')
                    .attr('x', margin.left - 12)
                    .attr('y', y + yScale.bandwidth() / 2 + 4)
                    .attr('text-anchor', 'end')
                    .attr('fill', 'var(--sub)')
                    .text(cat);
            });

            // 出来事カード
            const eventGroups = svg.selectAll('.event-group')
                .data(eventsData)
                .enter()
                .append('g')
                .attr('class', 'event-group')
                .attr('transform', d => `translate(${xScale(d.year)}, ${yScale(d.category) + 4})`)
                .style('cursor', 'pointer')
                .on('click', (event, d) => showEventDetails(d));

            eventGroups.append('circle')
                .attr('cx', 0)
                .attr('cy', 12)
                .attr('r', 3.5)
                .attr('fill', 'var(--accent)');

            eventGroups.append('rect')
                .attr('x', 6)
                .attr('y', 1)
                .attr('rx', 4)
                .attr('ry', 4)
                .attr('width', d => Math.min(240, d.title.length * 13 + 18))
                .attr('height', 22)
                .attr('fill', '#ffffff')
                .attr('stroke', '#b7c0c8')
                .attr('stroke-width', 1);

            eventGroups.append('text')
                .attr('class', 'eventtext')
                .attr('x', 12)
                .attr('y', 16)
                .text(d => d.title.length > 18 ? d.title.substring(0, 18) + '…' : d.title);
        }

        /**
         * 詳細情報の表示
         */
        function showEventDetails(eventData) {
            const content = document.getElementById('detailsContent');
            if (!content) return;

            let html = `<div class="event-card">`;
            html += `<strong>【${eventData.year}年】${eventData.title}</strong>`;
            html += `<span class="source">カテゴリ: ${eventData.category}</span>`;
            if (eventData.description) html += `<div>${eventData.description}</div>`;
            if (eventData.quote) html += `<div class="quote">"${eventData.quote}"</div>`;
            if (eventData.source) html += `<div class="source">出典: ${eventData.source}</div>`;
            html += `</div>`;

            content.innerHTML = html;
        }

        // 画面読み込み完了時に自動実行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVisualization);
        } else {
            initVisualization();
        }
    </script>
</body>

</html>
