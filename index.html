<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>定量グラフ・出来事年表（インタラクティブ）</title>

<style>
  /* ===================================================================
     基本レイアウト
     - body を flex column にし、CSS の order で「見た目の並び順」を
       コントロールする。HTML のソース上はタイトル・説明・操作ボタン類を
       先に書いているが、画面には「グラフ → タイトル・説明・操作ボタン」
       の順で表示する（レイアウト都合）。
     =================================================================== */
  :root {
    --line: #d8dee4;
    --ink: #17202a;
    --sub: #53606b;
    --accent: #176d75;
  }
  * { box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 16px;
    max-width: 1220px;
    margin-inline: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    background: #f5f7f8;
  }
  body > #wrap { order: 1; }
  body > .details { order: 2; }
  body > h1,
  body > p.intro,
  body > .toolbar,
  body > .metric-row,
  body > .tp-heading,
  body > #tpTags,
  body > #tpMode,
  body > .hint,
  body > .tp-dialog,
  body > #csvDialog {
    order: 3;
  }

  h1 {
    font-size: 20px;
    margin: 24px 0 4px;
  }
  p.intro {
    color: var(--sub);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 16px;
  }

  /* ===================================================================
     操作系 UI（ツールバー・CSV ダイアログ・転換点ダイアログ）
     =================================================================== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 12px 0;
  }
  .toolbar button {
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar .export {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--sub);
  }
  .toolbar .export button {
    background: white;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .metric-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin: 8px 0;
  }

  .tp-heading {
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
  }
  .tp-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0;
  }
  .tp-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fdf3e4;
    border: 1px solid #d9b877;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .tp-tag button {
    border: 0;
    background: none;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    color: #8a5a1e;
  }
  #tpMode {
    border: 1px solid var(--accent);
    background: white;
    color: var(--accent);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .hint {
    font-size: 12px;
    color: var(--sub);
    margin: 8px 0;
  }

  dialog {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    max-width: 420px;
  }
  dialog .dialog-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 0;
  }
  .tp-dialog {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
  }

  /* ===================================================================
     チャート本体
     - 上段（定量グラフ）は高さを固定して常に見える状態にする
     - 下段（出来事年表）だけがスクロールする
     - 上段・下段はそれぞれ独立した <svg> で、同じ座標計算を共有して
       描画する（複製・監視のような仕組みは使わない）
     =================================================================== */
  #wrap {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  #quantViewport {
    height: 300px;
    border-bottom: 1px solid var(--line);
  }
  #quantViewport svg,
  #timelineViewport svg {
    width: 100%;
    display: block;
  }
  #timelineViewport {
    height: 60vh;
    min-height: 320px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .grid { stroke: #e7ebee; stroke-width: 1; }
  .axis { stroke: #b7c0c8; stroke-width: 1; }
  .tick { fill: var(--sub); font-size: 11px; }
  .qarea { fill: #9fd3d8; fill-opacity: 0.5; }
  .qline { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .turn { stroke: #9b5a1e; stroke-width: 1.3; stroke-dasharray: 4 3; }
  .turntext { fill: #7a1f1f; font-size: 12px; }
  .guideline { stroke: #8a97a3; stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
  .guidetext { fill: #33414d; font-size: 12px; font-weight: 600; pointer-events: none; }

  .lane-label { font-size: 12px; font-weight: 600; }
  .lane-label.selected { text-decoration: underline; }
  .lane-band { fill: #f5f7f8; }
  .eventtext { font-size: 11.5px; fill: #17202a; }

  .chart-title {
    font-size: 20px;
    font-weight: 700;
    fill: var(--ink);
    cursor: text;
  }
  .title-edit {
    position: absolute;
    font-size: 16px;
    font-weight: 700;
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
  }

  /* 印刷（PDF書き出し）時は、スクロール枠を解除して全体を表示する */
  @media print {
    #quantViewport,
    #timelineViewport {
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .toolbar, .metric-row, .tp-heading, #tpTags, #tpMode, .hint, .tp-dialog {
      display: none !important;
    }
  }

  /* ===================================================================
     選択行の出来事パネル（チャートの直後、order: 2 に表示）
     =================================================================== */
  .details {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .details h2 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  .details .hint {
    margin: 0;
  }
  .event-card {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .event-card .source {
    font-size: 11px;
    color: var(--sub);
  }
  .event-card .source a {
    color: var(--accent);
  }
</style>
</head>

<body>
  <!-- ============================================================
       サイトタイトル・説明・操作系 UI
       （画面上は CSS order により一番下に表示される）
       ============================================================ -->
  <h1>定量グラフ・出来事年表（インタラクティブ）</h1>
  <p class="intro">
    ポケベルの加入数の推移と、関連する社会的出来事を同じ時間軸で確認できます。
    出来事はそれぞれの行に常時テキストで表示され、年代が近いものは段を分けて
    重ならないようにしています。行名をクリックすると、下のパネルにその行の
    出来事が一覧表示されます。
  </p>

  <div class="toolbar">
    <button id="builderToggle" type="button">年表を作成</button>
    <div class="export">
      <span>書き出し：</span>
      <button id="exportSvg" type="button">svg</button>
      <button id="exportPng" type="button">png</button>
      <button id="exportPdf" type="button">pdf</button>
    </div>
  </div>

  <dialog id="csvDialog">
    <h2>年表を作成</h2>
    <div class="dialog-row">
      <label>出来事CSV<input id="eventCsv" type="file" accept=".csv,text/csv" /></label>
      <a id="eventTemplate" download="出来事_template.csv" href="#">ひな型をダウンロード</a>
    </div>
    <div class="dialog-row">
      <label>定量CSV<input id="quantCsv" type="file" accept=".csv,text/csv" /></label>
      <a id="quantTemplate" download="定量_template.csv" href="#">ひな型をダウンロード</a>
    </div>
    <button id="csvClose" type="button">閉じる</button>
  </dialog>

  <div class="metric-row">
    <label for="metric">定量表示</label>
    <select id="metric">
      <option value="actual">ポケベル加入数（実数）</option>
      <option value="index">ポケベル加入数（指数：1988年=100）</option>
    </select>
  </div>

  <div class="tp-heading">転換点</div>
  <div id="tpTags" class="tp-tags" aria-live="polite"></div>
  <button id="tpMode" type="button">転換点を追加</button>
  <div class="hint">
    行名クリック：下のパネルにその行の出来事を一覧表示　｜　出来事の枠クリック：出典URLがあれば開く
    ｜　マウスオーバー：年・値を表示
  </div>
  <div id="tpDialog" class="tp-dialog" hidden>
    <label>転換点ラベル<input id="tpLabel" type="text" /></label>
    <button id="tpSave" type="button">登録</button>
    <button id="tpCancel" type="button">キャンセル</button>
  </div>

  <!-- ============================================================
       チャート本体
       画面上は一番上に表示される（#wrap { order: 1 }）
       ============================================================ -->
  <div id="wrap">
    <div id="quantViewport">
      <svg id="quantSvg" role="img" aria-label="ポケベル加入数の推移"></svg>
    </div>
    <div id="timelineViewport">
      <svg id="timelineSvg" role="img" aria-label="出来事年表"></svg>
    </div>
  </div>

  <div class="details" id="details" aria-live="polite">
    <h2>選択行の出来事</h2>
    <div class="event-list">
      <span class="hint">行名をクリックすると、その行の出来事がすべて表示されます。</span>
    </div>
  </div>

/* =====================================================================
   3. 座標まわりの定数・計算式
   上段・下段どちらのSVGも、この同じ定数・関数を使って位置を合わせる。
   ===================================================================== */
const W = 1180;
const LEFT = 235;
const RIGHT = 1145;

// 上段（定量グラフ）
const Q_TOP = 42;
const Q_BOTTOM = 230;
const Q_HEIGHT = 280;

// 下段（出来事年表）
const LANE_TOP = 16;     // 一番上の余白
const LANE_GAP = 14;     // 行と行の間の余白
const ROW_GAP = 4;       // 同じ行内の段と段の間の余白
const BOX_GAP = 10;      // 横に並ぶ出来事どうしの最小間隔
const BOX_MAX_W = 250;   // 出来事テキストの最大幅（これを超えたら折り返す）
const BOX_PAD = 6;       // テキストとボックス枠の余白
const FONT_SIZE = 11.5;
const LINE_H = 14;
const MIN_ROW_H = 20;

function years() {
  const ys = [
    ...new Set(
      DATA.quant.map((d) => +d.date.slice(0, 4)).concat(DATA.events.map((e) => e.year))
    )
  ];
  return ys.sort((a, b) => a - b);
}
function minYear() { return years()[0]; }
function maxYear() { return years()[years().length - 1]; }
function x(year) {
  return LEFT + ((year - minYear()) / (maxYear() - minYear())) * (RIGHT - LEFT);
}

// テキストの実際の描画幅を測るための、非表示 canvas
const measureCtx = document.createElement("canvas").getContext("2d");
measureCtx.font = `${FONT_SIZE}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif`;
function measureWidth(text) { return measureCtx.measureText(text).width; }

// テキストを、最大幅に収まるよう複数行に折り返す
function layoutText(text) {
  const innerMax = BOX_MAX_W - BOX_PAD * 2;
  const full = measureWidth(text);
  if (full <= innerMax) {
    return { lines: [text], w: full + BOX_PAD * 2 };
  }
  const lines = [];
  let cur = "";
  for (const ch of text) {
    const test = cur + ch;
    if (measureWidth(test) > innerMax && cur) {
      lines.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return { lines, w: BOX_MAX_W };
}

// 出来事年表の全体レイアウトを計算する。
// 同じ行（レーン）の中で、年が近い出来事どうしが重なる場合は
// 段（サブ行）を増やして避ける（区間スケジューリングの考え方）。
let currentLayout = null;
function computeLayout() {
  const boxes = [];
  const laneInfos = [];
  let cursorY = LANE_TOP;

  DATA.lanes.forEach((lane) => {
    const items = DATA.events
      .map((e, i) => ({ e, i }))
      .filter(({ e }) => e.lane === lane)
      .sort((a, b) => a.e.year - b.e.year)
      .map(({ e, i }) => {
        const text = e.detail || e.title;
        const { lines, w } = layoutText(text);
        return { e, i, lines, w, h: lines.length * LINE_H + BOX_PAD };
      });

    // 各出来事を、空いている一番上の段に詰めていく
    const rowRightEdge = []; // 各段の、これまでに置いた出来事の右端 x
    items.forEach((it) => {
      const startX = x(it.e.year);
      let row = rowRightEdge.findIndex((rightEdge) => startX >= rightEdge + BOX_GAP);
      if (row === -1) { row = rowRightEdge.length; rowRightEdge.push(0); }
      rowRightEdge[row] = startX + it.w;
      it.row = row;
    });

    const rowCount = Math.max(1, rowRightEdge.length);
    const rowHeights = new Array(rowCount).fill(MIN_ROW_H);
    items.forEach((it) => { rowHeights[it.row] = Math.max(rowHeights[it.row], it.h); });

    const rowTop = [];
    let acc = 0;
    rowHeights.forEach((h) => { rowTop.push(acc); acc += h + ROW_GAP; });
    const laneHeight = acc - ROW_GAP;

    items.forEach((it) => {
      boxes.push({
        e: it.e, i: it.i, lines: it.lines, w: it.w, h: it.h,
        x: x(it.e.year), y: cursorY + rowTop[it.row]
      });
    });

    laneInfos.push({ lane, top: cursorY, height: laneHeight, center: cursorY + laneHeight / 2 });
    cursorY += laneHeight + LANE_GAP;
  });

  currentLayout = { boxes, laneInfos, totalHeight: cursorY };
  return currentLayout;
}
function timelineHeight() {
  return (currentLayout || computeLayout()).totalHeight;
}

function el(name, attrs = {}, text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text != null) node.textContent = text;
  return node;
}

function metricValues() {
  const metric = document.getElementById("metric").value;
  const raw = DATA.quant.filter((d) => Number.isFinite(d.value));
  if (!raw.length) return [];
  if (metric !== "index") return raw;
  const base = raw[0].value;
  return raw.map((d) => ({ ...d, value: (d.value / base) * 100 }));
}
function formatValue(v) {
  const metric = document.getElementById("metric").value;
  return metric === "index"
    ? v.toFixed(0)
    : new Intl.NumberFormat("ja-JP").format(Math.round(v));
}

/* =====================================================================
   4. 上段（定量グラフ）の描画
   ===================================================================== */
function drawQuant() {
  const svg = document.getElementById("quantSvg");
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${W} ${Q_HEIGHT}`);

  const gridLayer = el("g", { class: "gridLayer" });
  const quantLayer = el("g", { class: "quantLayer" });
  const turnLayer = el("g", { class: "turnLayer" });
  const titleLayer = el("g", { class: "titleLayer" });
  const guideLayer = el("g", { class: "guideLayer" });
  svg.append(gridLayer, quantLayer, turnLayer, titleLayer, guideLayer);

  svg.append(el("title", {}, "定量グラフ"));

  // タイトル（クリックで編集）
  const titleText = el(
    "text",
    { x: LEFT + 10, y: 26, class: "chart-title" },
    chartTitle
  );
  titleText.addEventListener("click", () => startTitleEdit(titleText));
  titleLayer.append(titleText);

  // 縦の年グリッド線（下段と位置を揃えるための基準）
  [1990, 1995, 2000, 2005, 2010]
    .filter((y) => y >= minYear() && y <= maxYear())
    .forEach((y) => {
      gridLayer.append(
        el("line", { x1: x(y), x2: x(y), y1: Q_TOP, y2: Q_BOTTOM, class: "grid" })
      );
    });

  svg.append(el("line", { x1: LEFT, x2: RIGHT, y1: Q_BOTTOM, y2: Q_BOTTOM, class: "axis" }));
  svg.append(el("line", { x1: LEFT, x2: LEFT, y1: Q_TOP, y2: Q_BOTTOM, class: "axis" }));

  const values = metricValues();
  const vmax = (Math.max(...values.map((d) => d.value)) * 1.08) || 1;
  const yq = (v) => Q_BOTTOM - (v / vmax) * (Q_BOTTOM - Q_TOP);

  [0, 0.5, 1].forEach((t) => {
    const yy = Q_BOTTOM - t * (Q_BOTTOM - Q_TOP);
    gridLayer.append(el("line", { x1: LEFT, x2: RIGHT, y1: yy, y2: yy, class: "grid" }));
    svg.append(el("text", { x: LEFT - 8, y: yy + 4, "text-anchor": "end", class: "tick" }, formatValue(vmax * t)));
  });

  if (values.length) {
    const path = values
      .map((d, i) => (i ? "L" : "M") + x(+d.date.slice(0, 4)) + "," + yq(d.value))
      .join(" ");
    quantLayer.append(
      el("path", {
        d: `M${x(minYear())},${Q_BOTTOM} ${path.slice(1)} L${x(maxYear())},${Q_BOTTOM} Z`,
        class: "qarea"
      })
    );
    quantLayer.append(el("path", { d: path, class: "qline" }));
  } else {
    quantLayer.append(el("text", { x: LEFT + 8, y: Q_TOP + 22, class: "turntext" }, "定量データなし（出来事のみ表示）"));
  }

  const metric = document.getElementById("metric").value;
  svg.append(
    el("text", { x: LEFT, y: Q_TOP - 17, class: "tick" },
      metric === "index" ? "加入数指数（1988年=100）" : "ポケベル加入数（人）")
  );

  DATA.turning_points.forEach((tp, i) => {
    const yr = +tp.date.slice(0, 4);
    const xx = x(yr);
    turnLayer.append(el("line", { x1: xx, x2: xx, y1: Q_TOP, y2: Q_BOTTOM, class: "turn" }));
    turnLayer.append(
      el("text", { x: xx + 4, y: Q_TOP + 14 + i * 16, class: "turntext" }, (tp.label || String(yr)).replace("\n", " "))
    );
  });

  // 転換点を追加するためのクリック領域
  const clickArea = el("rect", { x: LEFT, y: Q_TOP, width: RIGHT - LEFT, height: Q_BOTTOM - Q_TOP, fill: "transparent" });
  clickArea.addEventListener("click", (ev) => {
    if (!tpMode) return;
    const rect = svg.getBoundingClientRect();
    const scaleX = W / rect.width;
    const localX = (ev.clientX - rect.left) * scaleX;
    const yr = Math.round(minYear() + Math.max(0, Math.min(1, (localX - LEFT) / (RIGHT - LEFT))) * (maxYear() - minYear()));
    openTurningPointDialog(yr);
  });
  svg.append(clickArea);
}

/* =====================================================================
   5. 下段（出来事年表）の描画
   ===================================================================== */
function drawTimeline() {
  const svg = document.getElementById("timelineSvg");
  svg.innerHTML = "";
  const layout = computeLayout();
  const H = layout.totalHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const gridLayer = el("g", { class: "gridLayer" });
  const laneLayer = el("g", { class: "laneLayer" });
  const turnLayer = el("g", { class: "turnLayer" });
  const eventLayer = el("g", { class: "eventLayer" });
  const guideLayer = el("g", { class: "guideLayer" });
  svg.append(gridLayer, laneLayer, turnLayer, eventLayer, guideLayer);

  svg.append(el("title", {}, "出来事年表"));
  svg.append(
    el("desc", {}, "大分類・小分類ごとの行に出来事を常時表示。年が近い出来事は段を分けて重なりを避ける。行名クリックで下のパネルに一覧表示。")
  );

  // 縦の年グリッド線（上段と同じ x 位置に揃える）
  [1960, 1970, 1980, 1990, 2000, 2010, 2020]
    .filter((y) => y >= minYear() && y <= maxYear())
    .forEach((y) => {
      gridLayer.append(el("line", { x1: x(y), x2: x(y), y1: 0, y2: H - 30, class: "grid" }));
    });

  // 年の目盛り（一番下）
  [minYear(), 1960, 1970, 1980, 1990, 2000, 2010, 2020, maxYear()]
    .filter((y, i, arr) => arr.indexOf(y) === i && y >= minYear() && y <= maxYear())
    .forEach((y) => {
      svg.append(el("text", { x: x(y), y: H - 10, "text-anchor": "middle", class: "tick" }, String(y)));
    });

  // 転換点の縦線（続きであることが分かるよう、下段にも表示）
  DATA.turning_points.forEach((tp) => {
    const xx = x(+tp.date.slice(0, 4));
    turnLayer.append(el("line", { x1: xx, x2: xx, y1: 0, y2: H - 30, class: "turn" }));
  });

  // 行（レーン）ごとの背景帯・区切り線・ラベル・クリック領域
  layout.laneInfos.forEach(({ lane, top, height, center }, idx) => {
    if (idx % 2 === 1) {
      laneLayer.append(el("rect", { x: 0, y: top, width: W, height, class: "lane-band" }));
    }
    laneLayer.append(el("line", { x1: 0, x2: W, y1: top + height, y2: top + height, class: "grid" }));

    const label = el(
      "text",
      {
        x: 8,
        y: center + 4,
        class: "lane-label" + (activeLane === lane ? " selected" : ""),
        fill: DATA.palette[lane.split("｜")[0]] || "currentColor"
      },
      lane
    );
    laneLayer.append(label);

    const hit = el("rect", { x: 0, y: top, width: LEFT - 5, height, fill: "transparent", cursor: "pointer" });
    hit.addEventListener("click", () => {
      activeLane = activeLane === lane ? null : lane;
      drawTimeline();
      updateDetails();
    });
    laneLayer.append(hit);
  });

  // 出来事（常時表示のテキストボックス）
  layout.boxes.forEach(({ e, x: bx, y: by, w, h, lines }) => {
    const color = DATA.palette[e.major] || "#466a8a";
    const group = el("g", { class: "eventbox" });
    group.append(
      el("rect", {
        x: bx, y: by, width: w, height: h, rx: 3,
        fill: color, "fill-opacity": 0.12, stroke: color, "stroke-width": 1
      })
    );
    group.append(el("circle", { cx: bx + 6, cy: by + h / 2, r: 3, fill: color }));
    lines.forEach((line, j) => {
      group.append(
        el("text", { x: bx + BOX_PAD + 7, y: by + BOX_PAD + 4 + j * LINE_H, class: "eventtext" }, line)
      );
    });
    if (e.url) {
      group.style.cursor = "pointer";
      group.addEventListener("click", () => window.open(e.url, "_blank", "noreferrer"));
    }
    eventLayer.append(group);
  });
}

   6. 選択行の出来事パネルの更新

function updateDetails() {
  const details = document.getElementById("details");
  const list = details.querySelector(".event-list");
  list.innerHTML = "";
  if (!activeLane) {

      list.append(card);
    });
}

/* =====================================================================
   8. マウスオーバー時のガイド（縦線＋「年｜値」ラベル）
   上段・下段どちらの SVG も、この共通関数からガイドを描く。
   ラベルはマウスが今ある側の SVG にだけ、マウスの高さで表示する。
   ===================================================================== */
function onChartHover(ev, svg, part, topBound, bottomBound) {
  const rect = svg.getBoundingClientRect();
  const scaleX = W / rect.width;
  const viewBox = svg.viewBox.baseVal;
  const scaleY = viewBox.height / rect.height;
  const localX = (ev.clientX - rect.left) * scaleX;
  const localY = (ev.clientY - rect.top) * scaleY;

  if (localX < LEFT || localX > RIGHT) { onChartLeave(); return; }

  const yr = Math.round(minYear() + ((localX - LEFT) / (RIGHT - LEFT)) * (maxYear() - minYear()));
  hoverYear = Math.max(minYear(), Math.min(maxYear(), yr));
  hoverLocalY = { quant: null, timeline: null };
  hoverLocalY[part] = localY;

  drawGuide("quantSvg", part === "quant" ? localY : null, Q_TOP, Q_BOTTOM);
  drawGuide("timelineSvg", part === "timeline" ? localY : null, 0, timelineHeight() - 30);
}

function onChartLeave() {
  hoverYear = null;
  ["quantSvg", "timelineSvg"].forEach((id) => {
    const svg = document.getElementById(id);
    const layer = svg && svg.querySelector(".guideLayer");
    if (layer) layer.innerHTML = "";
  });
}

function drawGuide(svgId, labelY, top, bottom) {
  const svg = document.getElementById(svgId);
  const layer = svg.querySelector(".guideLayer");
  if (!layer) return;
  layer.innerHTML = "";
  if (hoverYear == null) return;

  const xx = x(hoverYear);
  layer.append(el("line", { x1: xx, x2: xx, y1: top, y2: bottom, class: "guideline" }));

  if (labelY == null) return; // ラベルはマウスがある側にだけ出す

  const values = metricValues();
  const nearest = values.length
    ? values.reduce((a, b) => (Math.abs(+a.date.slice(0, 4) - hoverYear) < Math.abs(+b.date.slice(0, 4) - hoverYear) ? a : b))
    : null;
  const text = nearest ? `${hoverYear}年｜${formatValue(nearest.value)}` : `${hoverYear}年`;
  const labelX = Math.min(RIGHT - 150, xx + 6);
  const clampedY = Math.max(top + 12, Math.min(bottom - 4, labelY));
  layer.append(el("text", { x: labelX, y: clampedY, class: "guidetext" }, text));
}

/* =====================================================================
   9. タイトルの編集
   ===================================================================== */
function startTitleEdit(titleTextEl) {
  const svg = document.getElementById("quantSvg");
  const rect = svg.getBoundingClientRect();
  const box = titleTextEl.getBBox();
  const scale = rect.width / W;

  const input = document.createElement("input");
  input.className = "title-edit";
  input.value = chartTitle;
  input.style.left = `${rect.left + box.x * scale}px`;
  input.style.top = `${rect.top + (box.y - 4) * scale}px`;
  input.style.width = `${Math.max(200, box.width * scale + 40)}px`;
  document.body.append(input);
  input.focus();
  input.select();

  const commit = () => {
    chartTitle = input.value.trim() || chartTitle;
    input.remove();
    drawQuant();
  };
  input.addEventListener("blur", commit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") { input.value = chartTitle; input.blur(); }
  });
}

function renderTpTags() {
  const box = document.getElementById("tpTags");
  box.innerHTML = "";

function openTurningPointDialog(year) {
  const dialog = document.getElementById("tpDialog");

/* =====================================================================
   11. CSV の読み込み・書き出し
   ===================================================================== */
function parseCsv(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(Boolean);
  const head = lines.shift().split(",").map((v) => v.trim().replace(/^"|"$/g, ""));
  return lines.map((line) => {
    const values = line.split(",").map((v) => v.trim().replace(/^"|"$/g, ""));
    return Object.fromEntries(head.map((h, i) => [h, values[i] || ""]));
  });
}

// CSV の列名は「（必須）」付きだが、読み込み時はそれを取り除いて照合する
function findField(row, ...names) {
  for (const key of Object.keys(row)) {
    const plain = key.replace(/（必須）/g, "").trim();
    if (names.includes(plain)) return row[key];
  }
  return "";
}

function loadCsv(file, type) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(reader.result);
    if (type === "event") {
      DATA.events = rows.map((r) => {
        const major = findField(r, "大分類");
        const minor = findField(r, "小分類");
        const year = +findField(r, "年");
        return {
          year,
          date: `${year}-01-01`,
          major, minor,
          lane: minor ? `${major}｜${minor}` : major,
          title: findField(r, "出来事"),
          detail: findField(r, "説明"),
          source: findField(r, "出典"),
          url: findField(r, "URL")
        };
      });
      DATA.lanes = [...new Set(DATA.events.map((e) => e.lane))];
    } else {
      DATA.quant = rows.map((r) => {
        const year = findField(r, "年");
        return {
          date: `${year}-01-01`,
          series: findField(r, "系列名（全行同じ名前）", "系列名"),
          value: +findField(r, "値") || 0
        };
      });
    }
    redraw();
  };
  reader.readAsText(file, "UTF-8");
}

function csvCell(v) { return `"${String(v ?? "").replace(/"/g, '""')}"`; }

function updateCsvLinks() {
  const eventRows = DATA.events.map((e) =>
    [e.year, e.major, e.minor, e.title, e.detail, e.source, e.url].map(csvCell).join(",")
  );
  const quantRows = DATA.quant.map((d) =>
    [+d.date.slice(0, 4), d.value, d.series].map(csvCell).join(",")
  );
  const eventCsv = [EVENT_CSV_HEADERS.map(csvCell).join(","), ...eventRows].join("\n") + "\n";
  const quantCsv = [QUANT_CSV_HEADERS.map(csvCell).join(","), ...quantRows].join("\n") + "\n";

  const eventLink = document.getElementById("eventTemplate");
  const quantLink = document.getElementById("quantTemplate");
  eventLink.href = URL.createObjectURL(new Blob(["\ufeff" + eventCsv], { type: "text/csv;charset=utf-8" }));
  quantLink.href = URL.createObjectURL(new Blob(["\ufeff" + quantCsv], { type: "text/csv;charset=utf-8" }));
}

/* =====================================================================
   12. 書き出し（SVG / PNG / PDF）
   上段・下段2つの SVG を、書き出し用に1枚の SVG へ結合してから出力する。
   ===================================================================== */
function buildExportSvg() {
  const quant = document.getElementById("quantSvg");
  const timeline = document.getElementById("timelineSvg");
  const quantH = Q_HEIGHT;
  const timelineH = timelineHeight();

  const exportSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  exportSvg.setAttribute("viewBox", `0 0 ${W} ${quantH + timelineH}`);
  exportSvg.setAttribute("xmlns", "http://www.w3.org/2000/svg");

  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  style.textContent = [...document.querySelectorAll("style")].map((s) => s.textContent).join("\n");
  exportSvg.append(style);

  const quantGroup = quant.cloneNode(true);
  quantGroup.removeAttribute("id");
  const quantWrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
  [...quantGroup.childNodes].forEach((n) => quantWrapper.append(n));
  exportSvg.append(quantWrapper);

  const timelineGroup = timeline.cloneNode(true);
  timelineGroup.removeAttribute("id");
  const timelineWrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
  timelineWrapper.setAttribute("transform", `translate(0, ${quantH})`);
  [...timelineGroup.childNodes].forEach((n) => timelineWrapper.append(n));
  exportSvg.append(timelineWrapper);

  return { svg: exportSvg, width: W, height: quantH + timelineH };
}

function downloadBlob(name, blob) {
  const a = document.createElement("a");
  a.download = name;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById("exportSvg").addEventListener("click", () => {
  const { svg } = buildExportSvg();
  const source = new XMLSerializer().serializeToString(svg);
  downloadBlob("timeline.svg", new Blob([source], { type: "image/svg+xml" }));
});

document.getElementById("exportPng").addEventListener("click", () => {
  const { svg, width, height } = buildExportSvg();
  const source = new XMLSerializer().serializeToString(svg);
  const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => downloadBlob("timeline.png", blob), "image/png");
  };
  img.src = src;
});

document.getElementById("exportPdf").addEventListener("click", () => window.print());

/* =====================================================================
   13. 画面全体の再描画・イベント配線
   ===================================================================== */
function redraw() {
  updateCsvLinks();
  renderTpTags();
  drawQuant();
  drawTimeline();
  updateDetails();
}

// マウスオーバーのガイド用リスナーは、SVG要素自体は再描画のたびに
// 作り直されないので、最初に1回だけ登録すればよい。
function setupHoverGuides() {
  const quantSvg = document.getElementById("quantSvg");
  const timelineSvg = document.getElementById("timelineSvg");
  quantSvg.addEventListener("mousemove", (ev) => onChartHover(ev, quantSvg, "quant", Q_TOP, Q_BOTTOM));
  quantSvg.addEventListener("mouseleave", onChartLeave);
  timelineSvg.addEventListener("mousemove", (ev) => onChartHover(ev, timelineSvg, "timeline", 0, timelineHeight() - 30));
  timelineSvg.addEventListener("mouseleave", onChartLeave);
}

document.getElementById("metric").addEventListener("change", redraw);

document.getElementById("builderToggle").addEventListener("click", () => {
  updateCsvLinks();
  document.getElementById("csvDialog").showModal();
});
document.getElementById("csvClose").addEventListener("click", () => document.getElementById("csvDialog").close());
document.getElementById("eventCsv").addEventListener("change", (e) => e.target.files[0] && loadCsv(e.target.files[0], "event"));
document.getElementById("quantCsv").addEventListener("change", (e) => e.target.files[0] && loadCsv(e.target.files[0], "quant"));

document.getElementById("tpMode").addEventListener("click", () => {
  tpMode = !tpMode;
  document.getElementById("tpMode").textContent = tpMode ? "グラフ上をクリック（入力待ち）" : "転換点を追加";
});

redraw();
setupHoverGuides();
</script>
</body>
</html>
